<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <header>
        <a href="index.html" class="logo"
            style="text-decoration: none; font-weight: 800; font-family: sans-serif; letter-spacing: -2px; display: flex; align-items: center; font-size: 1.7rem;">
            <span style="color: #01725a;">S</span><span style="color: #333;">TEP</span>
        </a>
        <nav>
            <div class="dropdown">
                <div class="dropbtn bar">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="dropdown-content">
                    <div class="dropdown-arrow"></div>
                    <a href="login.html">Login</a>
                    <a href="about.html">About Us</a>
                    <a href="contact.html">Contact Us</a>
                </div>
            </div>
        </nav>
    </header>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <h1 style="color:#02523f">Reset Password</h1>

            <div id="divForm">
                <div id="step1">
                    <p>Enter your email to receive a verification code.</p>
                    <input type="email" id="resetEmail" placeholder="Email Address" required
                        style="width: 100%; padding: 12px; box-sizing: border-box; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;">
                    <button type="button" id="sendCodeBtn" class="cta-btn" style="width: 100%;">Send Code</button>
                </div>

                <div id="step2" style="display:none;">
                    <p style="color: green; font-weight: bold;">Code sent! Check your email.</p>
                    <input type="text" id="verifyCode" placeholder="6-digit code"
                        style="width: 100%; padding: 12px; box-sizing: border-box; margin-bottom: 10px;">
                    <label style="display:block; text-align:left; margin-bottom:5px;">New Password:</label>
                    <input type="password" id="newPass"
                        style="width: 100%; padding: 12px; box-sizing: border-box; margin-bottom: 15px;">
                    <button type="button" id="finishResetBtn" class="cta-btn" style="width: 100%;">Update
                        Password</button>
                </div>
            </div>

            <div id="divLoading" style="display:none; text-align:center; padding: 20px;">
                <img src="loading.gif" alt="Loading..." style="width: 100px;">
                <p id="loadingText">Processing...</p>
            </div>

            <div id="divSuccess" style="display:none; text-align:center; padding: 20px;">
                <h2 style="color: green;">Success!</h2>
                <p id="successText">Action completed.</p>
            </div>
            <div>
                <button id="backBtn" class="cta-btn" style="background: #666; margin-top: 10px; width: 100%;">Back To
                    Login</button>
            </div>
        </div>
    </main>

    <footer>
        <div>
            <a href="contact.html">Contact Us</a>
            <a href="guidelines.html">Guidelines</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
            <a href="https://unibrightonac.sharepoint.com/" target="_blank"
                style="font-size: 0.75rem; opacity: 0.8; margin-top: 5px;">MyBrighton</a>
        </div>

        <div style="margin-top: 20px; font-size: 0.8rem; color: #01725a; width: 100%; padding-top: 2px;">
            © 2026, STEP — University of Brighton.
        </div>
    </footer>
    <script src="forgot-password.js"></script>
</body>

</html>
